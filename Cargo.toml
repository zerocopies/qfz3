[workspace]
members = [
    "qfz3-engine",
]
# buzz-core and buzz-bench were removed from this workspace on 2026-08-03:
# they were incomplete/stray local scaffolding, not real members. The real
# buzz-core lives in the separate buzz-cli repo and is referenced there as
# a path dependency by qfz3-engine, not as a workspace member here.
resolver = "2"

[workspace.package]
edition = "2021"
authors = ["modhalaali"]
license = "MIT"

[profile.release]
opt-level = 3
lto = true
